# Tool configuration. The app is run from source (python app.py); runtime
# dependencies are pinned in requirements.txt, dev tools in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

# zip(strict=True) would turn a silent length mismatch into a crash in
# production; the zipped sequences are equal-length by construction.
ignore = ["B905"]
